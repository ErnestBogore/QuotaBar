name: Build Preview DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/prepare-hook.sh release
      - run: pnpm check && pnpm test && cargo test --workspace
      - run: pnpm tauri build --bundles app
      - name: Sign the app and helper
        run: |
          app="target/release/bundle/macos/QuotaBar.app"
          codesign --force --sign - --identifier app.quotabar.hook "$app/Contents/MacOS/quotabar-hook"
          codesign --force --deep --sign - --identifier app.quotabar.mac "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Build the drag-to-Applications installer
        run: |
          brew install create-dmg
          installer_dir="$(mktemp -d)"
          ditto target/release/bundle/macos/QuotaBar.app "$installer_dir/QuotaBar.app"
          mkdir -p target/release/bundle/dmg
          create-dmg --volname "QuotaBar" --window-size 660 400 --icon-size 112 --icon "QuotaBar.app" 180 195 --hide-extension "QuotaBar.app" --app-drop-link 480 195 --no-internet-enable --overwrite target/release/bundle/dmg/QuotaBar.dmg "$installer_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaBar-dmg
          path: target/release/bundle/dmg/QuotaBar.dmg
          compression-level: 0
          if-no-files-found: error
